<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LKS MILITAR - Base de Conhecimento Tático</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Tema Dark Nativo -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <style>
    :root {
      --theme-color: #ff1e3c; /* Vermelho Tático LKS */
      --bg-dark: #090c12;
    }
    body {
      background-color: var(--bg-dark);
      font-family: 'Inter', sans-serif;
    }
    .sidebar {
      background-color: #06080c !important;
      border-right: 1px solid #161c28;
    }
    .sidebar-nav a {
      color: #94a3b8;
    }
    .sidebar-nav a:hover, .sidebar-nav .active > a {
      color: #ff1e3c !important;
      font-weight: bold;
    }
    iframe.pdf-viewer {
      width: 100%;
      height: 85vh;
      border: 1px solid #161c28;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app">Carregando Repositório LKS MILITAR...</div>

  <script>
    window.$docsify = {
      name: 'LKS MILITAR',
      repo: 'LKSMilitar/LKSMilitar-Docs',
      loadSidebar: true,
      autoHeader: true,
      subMaxLevel: 3,
      search: {
        placeholder: 'Pesquisar Documentos...',
        noData: 'Nenhum resultado encontrado.',
        depth: 6
      }
    }
  </script>

  <!-- Motores e Plugins Globais -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
