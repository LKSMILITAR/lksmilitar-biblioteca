<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>LKSMILITAR - Biblioteca Técnica</title>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, sans-serif;
      background: #eff0f4;
      color: #172033;
    }

    button,
    input {
      font: inherit;
    }

    .sidebar {
      position: fixed;
      top: 12px;
      bottom: 12px;
      left: 12px;
      width: 78px;
      padding: 10px 12px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0000000a;
      transition: width 0.25s;
    }

    .sidebar.open {
      width: 270px;
    }

    .logo {
      position: relative;
      height: 52px;
      display: flex;
      align-items: center;
    }

    .logo > i {
      min-width: 50px;
      text-align: center;
      font-size: 23px;
    }

    .logo strong,
    .nav-name,
    .profile-text {
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .sidebar.open .logo strong,
    .sidebar.open .nav-name,
    .sidebar.open .profile-text {
      opacity: 1;
    }

    .menu-btn {
      position: absolute;
      right: 0;
      min-width: 44px;
      min-height: 44px;
      border: 0;
      background: transparent;
      color: #64748b;
      font-size: 22px;
      cursor: pointer;
    }

    .search {
      position: relative;
      margin: 8px 0;
    }

    .search i {
      position: absolute;
      top: 12px;
      left: 13px;
      color: #64748b;
    }

    .search input {
      width: 100%;
      height: 42px;
      padding: 0 10px 0 40px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      background: #f8fafc;
    }

    .search input:focus {
      border-color: #2563eb;
    }

    .nav {
      flex: 1;
      padding: 0;
      margin: 4px 0;
      overflow-y: auto;
      list-style: none;
    }

    .nav button {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #334155;
      cursor: pointer;
    }

    .nav button:hover,
    .nav button.active {
      background: #f1f5f9;
    }

    .nav button i {
      min-width: 50px;
      font-size: 19px;
    }

    .nav-name {
      font-size: 13px;
      font-weight: 600;
    }

    .profile {
      height: 48px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .profile > i {
      min-width: 50px;
      text-align: center;
    }

    .profile-text strong {
      font-size: 12px;
    }

    .profile-text small {
      display: block;
      color: #64748b;
      font-size: 10px;
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 19;
      background: #0f172a66;
    }

    .backdrop.active {
      display: block;
    }

    main {
      margin-left: 102px;
      padding: 24px 32px;
      transition: margin-left 0.25s;
    }

    .sidebar.open ~ main {
      margin-left: 298px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
    }

    .header p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .mobile-menu {
      display: none;
      min-width: 44px;
      min-height: 44px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 22px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 19px;
      cursor: pointer;
    }

    .icon-btn.active {
      background: #0f172a;
      color: #ffffff;
    }

    .status {
      padding: 16px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      color: #64748b;
    }

    .status.error {
      color: #991b1b;
      background: #fef2f2;
      border-color: #fecaca;
    }

    .status button {
      padding: 9px 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      cursor: pointer;
    }

    .docs.grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
    }

    .grid .card {
      padding: 14px;
    }

    .cover {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      color: #94a3b8;
      font-size: 58px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      word-break: break-word;
    }

    .meta {
      margin-top: 5px;
      color: #64748b;
      font-size: 11px;
    }

    .docs.list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
    }

    .list .cover {
      width: 38px;
      height: 50px;
      flex: 0 0 auto;
      margin: 0;
    }

    .list .info {
      flex: 1;
      min-width: 0;
    }

    .list .title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .open-label {
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
    }

    .grid .open-label {
      display: none;
    }

    .pagination {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      margin-top: 28px;
    }

    .pagination button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
    }

    .pagination button.active {
      background: #0f172a;
      color: #ffffff;
    }

    .pagination button:disabled {
      opacity: 0.4;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #0f172acc;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(100%, 1000px);
      height: min(90vh, 900px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      border-radius: 16px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #f8fafc;
    }

    .modal-head strong {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
    }

    .modal-head a {
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .modal-head button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      background: transparent;
      font-size: 28px;
    }

    .modal iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #1a1a1a;
    }

    @media (max-width: 768px) {
      .sidebar {
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        z-index: 21;
        border-radius: 0 18px 18px 0;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      main,
      .sidebar.open ~ main {
        margin-left: 0;
        padding: 12px;
      }

      .mobile-menu {
        display: block;
      }

      .header {
        padding: 12px;
      }

      .header p {
        font-size: 12px;
      }

      .docs.grid {
        grid-template-columns:
          repeat(auto-fill, minmax(155px, 1fr));
        gap: 10px;
      }

      .grid .cover {
        height: 150px;
      }

      .modal {
        padding: 0;
      }

      .modal-box {
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

  js/acervo-service.jsscript>

  <script>
    "use strict";

    const MODULOS = [
      {
        id: "termodinamica",
        nome: "Termodinâmica",
        icon: "bx-current-location"
      },
      {
        id: "eletrodinamica",
        nome: "Eletrodinâmica",
        icon: "bx-bolt-circle"
      },
      {
        id: "collection-asas",
        nome: "Coleção Asas",
        icon: "bx-wind"
      },
      {
        id: "testes-dtic",
        nome: "Testes DTIC",
        icon: "bx-test-tube"
      }
    ];

    const MODULO_PADRAO = "termodinamica";
    const ITENS_POR_PAGINA = 8;

    let moduloAtual = MODULO_PADRAO;
    let documentos = [];
    let documentosFiltrados = [];
    let paginaAtual = 1;
    let modoVisualizacao = "grid";

    const elemento = id =>
      document.getElementById(id);

    const container = elemento("docs");
    const paginacao = elemento("pagination");
    const sidebar = elemento("sidebar");
    const backdrop = elemento("backdrop");

    function escapar(texto) {
      const div = document.createElement("div");
      div.textContent = String(texto || "");
      return div.innerHTML;
    }

    function fecharMenu() {
      sidebar.classList.remove("open");
      backdrop.classList.remove("active");
    }

    function alternarMenu() {
      sidebar.classList.toggle("open");

      if (window.innerWidth <= 768) {
        backdrop.classList.toggle(
          "active",
          sidebar.classList.contains("open")
        );
      }
    }

    function montarMenu() {
      const nav = elemento("nav");
      nav.innerHTML = "";

      MODULOS.forEach(modulo => {
        const item = document.createElement("li");
        const botao = document.createElement("button");

        botao.className =
          modulo.id === moduloAtual
            ? "active"
            : "";

        botao.innerHTML = `
          <i class="bx ${modulo.icon}"></i>
          <span class="nav-name">
            ${escapar(modulo.nome)}
          </span>
        `;

        botao.addEventListener("click", () => {
          fecharMenu();

          if (location.hash !== `#${modulo.id}`) {
            location.hash = modulo.id;
          } else {
            carregarModulo(modulo.id);
          }
        });

        item.appendChild(botao);
        nav.appendChild(item);
      });
    }

    async function carregarModulo(
      idModulo,
      forcarAtualizacao = false
    ) {
      const moduloEncontrado =
        MODULOS.find(
          item => item.id === idModulo
        ) || MODULOS[0];

      moduloAtual = moduloEncontrado.id;
      paginaAtual = 1;

      elemento("heading").textContent =
        moduloEncontrado.nome;

      elemento("subtitle").textContent =
        `Materiais técnicos de ${moduloEncontrado.nome}.`;

      montarMenu();

      container.innerHTML = `
        <div class="status">
          Consultando o acervo...
        </div>
      `;

      paginacao.innerHTML = "";

      try {
        documentos =
          await AcervoService.obterModulo(
            moduloAtual,
            forcarAtualizacao
          );

        filtrarDocumentos();
      } catch (erro) {
        documentos = [];
        documentosFiltrados = [];

        container.innerHTML = `
          <div class="status error">
            <strong>
              Não foi possível abrir esta pasta.
            </strong>

            <br><br>

            ${escapar(erro.message)}

            <br>

            <button id="retry">
              Tentar novamente
            </button>
          </div>
        `;

        elemento("retry").addEventListener(
          "click",
          () => carregarModulo(
            moduloAtual,
            true
          )
        );
      }
    }

    function filtrarDocumentos() {
      const pesquisa = elemento("search")
        .value
        .trim()
        .toLocaleLowerCase("pt-BR");

      documentosFiltrados =
        documentos.filter(documento =>
          documento.nome
            .toLocaleLowerCase("pt-BR")
            .includes(pesquisa)
        );

      paginaAtual = 1;
      renderizarDocumentos();
    }

    function criarImagem(documento) {
      if (!documento.capaUrl) {
        return `
          <i
            class="bx bxs-file-pdf placeholder"
            aria-hidden="true"
          ></i>
        `;
      }

      return `
        <img
          src="${escapar(documento.capaUrl)}"
          alt="Capa de ${escapar(documento.nome)}"
          loading="lazy"
          onerror="
            this.style.display='none';
            this.parentElement
              .querySelector('.placeholder-fallback')
              .style.display='block';
          "
        >

        <i
          class="bx bxs-file-pdf
                 placeholder
                 placeholder-fallback"
          style="display:none"
          aria-hidden="true"
        ></i>
      `;
    }

    function renderizarDocumentos() {
      container.className =
        `docs ${modoVisualizacao}`;

      container.innerHTML = "";

      if (documentosFiltrados.length === 0) {
        container.innerHTML = `
          <div class="status">
            Nenhum documento encontrado
            nesta pasta.
          </div>
        `;

        paginacao.innerHTML = "";
        return;
      }

      const inicio =
        (paginaAtual - 1) *
        ITENS_POR_PAGINA;

      const fim =
        inicio + ITENS_POR_PAGINA;

      documentosFiltrados
        .slice(inicio, fim)
        .forEach(documento => {
          const card =
            document.createElement("article");

          card.className = "card";
          card.tabIndex = 0;

          card.innerHTML = `
            <div class="cover">
              ${criarImagem(documento)}
            </div>

            <div class="info">
              <div class="title">
                ${escapar(documento.nome)}
              </div>

              <div class="meta">
                ${escapar(
                  documento.tamanhoFormatado
                )}
              </div>
            </div>

            <span class="open-label">
              Abrir
            </span>
          `;

          card.addEventListener(
            "click",
            () => abrirDocumento(documento)
          );

          card.addEventListener(
            "keydown",
            evento => {
              if (
                evento.key === "Enter" ||
                evento.key === " "
              ) {
                evento.preventDefault();
                abrirDocumento(documento);
              }
            }
          );

          container.appendChild(card);
        });

      renderizarPaginacao();
    }

    function renderizarPaginacao() {
      const totalPaginas = Math.ceil(
        documentosFiltrados.length /
        ITENS_POR_PAGINA
      );

      paginacao.innerHTML = "";

      if (totalPaginas <= 1) {
        return;
      }

      function criarBotao(
        texto,
        destino,
        desabilitado = false,
        ativo = false
      ) {
        const botao =
          document.createElement("button");

        botao.textContent = texto;
        botao.disabled = desabilitado;
        botao.className = ativo
          ? "active"
          : "";

        botao.addEventListener(
          "click",
          () => {
            paginaAtual = destino;
            renderizarDocumentos();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          }
        );

        paginacao.appendChild(botao);
      }

      criarBotao(
        "‹",
        paginaAtual - 1,
        paginaAtual === 1
      );

      for (
        let pagina = 1;
        pagina <= totalPaginas;
        pagina++
      ) {
        criarBotao(
          String(pagina),
          pagina,
          false,
          pagina === paginaAtual
        );
      }

      criarBotao(
        "›",
        paginaAtual + 1,
        paginaAtual === totalPaginas
      );
    }

    function abrirDocumento(documento) {
      elemento("modal-title").textContent =
        documento.nome;

      elemento("download").href =
        documento.downloadUrl;

      elemento("viewer").src =
        documento.previewUrl;

      elemento("modal")
        .classList
        .add("active");

      document.body.style.overflow =
        "hidden";
    }

    function fecharDocumento() {
      elemento("viewer").src =
        "about:blank";

      elemento("modal")
        .classList
        .remove("active");

      document.body.style.overflow = "";
    }

    elemento("desktop-menu")
      .addEventListener(
        "click",
        alternarMenu
      );

    elemento("mobile-menu")
      .addEventListener(
        "click",
        alternarMenu
      );

    backdrop.addEventListener(
      "click",
      fecharMenu
    );

    elemento("search")
      .addEventListener(
        "input",
        filtrarDocumentos
      );

    elemento("refresh")
      .addEventListener(
        "click",
        () => carregarModulo(
          moduloAtual,
          true
        )
      );

    elemento("grid")
      .addEventListener(
        "click",
        () => {
          modoVisualizacao = "grid";

          elemento("grid")
            .classList
            .add("active");

          elemento("list")
            .classList
            .remove("active");

          renderizarDocumentos();
        }
      );

    elemento("list")
      .addEventListener(
        "click",
        () => {
          modoVisualizacao = "list";

          elemento("list")
            .classList
            .add("active");

          elemento("grid")
            .classList
            .remove("active");

          renderizarDocumentos();
        }
      );

    elemento("close")
      .addEventListener(
        "click",
        fecharDocumento
      );

    elemento("modal")
      .addEventListener(
        "click",
        evento => {
          if (
            evento.target ===
            elemento("modal")
          ) {
            fecharDocumento();
          }
        }
      );

    window.addEventListener(
      "keydown",
      evento => {
        if (evento.key === "Escape") {
          fecharDocumento();
        }
      }
    );

    window.addEventListener(
      "hashchange",
      () => {
        const id =
          location.hash.slice(1) ||
          MODULO_PADRAO;

        carregarModulo(id);
      }
    );

    document.addEventListener(
      "DOMContentLoaded",
      () => {
        const hash =
          location.hash.slice(1);

        const moduloInicial =
          MODULOS.some(
            item => item.id === hash
          )
            ? hash
            : MODULO_PADRAO;

        if (!location.hash) {
          history.replaceState(
            null,
            "",
            `#${moduloInicial}`
